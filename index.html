<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="支持 Shapefile 与 ASCII 坐标文件的浏览器端多边形面积计算工具">
  <title>多边形面积计算工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071320'/%3E%3Cpath d='M14 43 22 17l15 6 13-8-2 31-18 5z' fill='none' stroke='%234de1c1' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='37' cy='23' r='4' fill='%23d7ff57'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#071320;--panel:#0d1d2e;--panel2:#10263b;--line:#20384d;--text:#f3f8fb;--muted:#92a9bb;--cyan:#4de1c1;--lime:#d7ff57;--danger:#ff7b7b;--shadow:0 20px 70px #0006}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:radial-gradient(circle at 82% -10%,#164862 0,transparent 32rem),var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:auto;padding:28px 24px 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid #35637a;border-radius:12px;background:#10283a;box-shadow:inset 0 0 20px #4de1c119}.mark svg{width:27px}.eyebrow{color:var(--cyan);font-size:.78rem;letter-spacing:.18em;font-weight:800}.brand h1{font-size:1.42rem;margin:3px 0 0}.privacy{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}.privacy:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
    .grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(420px,1.4fr);gap:18px}.panel{background:linear-gradient(145deg,#0e2032ee,#091827f2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{margin:0;font-size:1rem}.step{font-family:ui-monospace,Consolas,monospace;color:var(--lime);font-size:.78rem}
    .input-body{padding:20px}.drop{min-height:190px;border:1.5px dashed #3a667a;border-radius:14px;background:#0b1b2a;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:.2s}.drop.drag{border-color:var(--lime);background:#142b34;transform:translateY(-2px)}.drop-icon{width:52px;height:52px;border-radius:16px;background:#153248;margin:0 auto 14px;display:grid;place-items:center;color:var(--cyan);font-size:1.5rem}.drop strong{display:block;font-size:1rem;margin-bottom:7px}.drop p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.7}.pick{display:inline-flex;margin-top:14px;border:0;border-radius:9px;background:var(--cyan);color:#052019;font-weight:800;padding:10px 16px}#fileInput{display:none}
    .or{display:flex;align-items:center;gap:10px;color:#607d91;font-size:.72rem;margin:17px 0}.or:before,.or:after{content:"";height:1px;flex:1;background:var(--line)}textarea{width:100%;min-height:124px;resize:vertical;background:#071521;color:#dbe8ef;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.55;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;outline:none}textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4de1c118}.text-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}.linkbtn{border:0;background:transparent;color:var(--cyan);padding:7px 0}.parsebtn{border:1px solid #315269;background:#122b3e;color:var(--text);border-radius:8px;padding:8px 13px}
    .settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:17px}.field label{display:block;color:var(--muted);font-size:.72rem;margin:0 0 6px}.field select{width:100%;background:#0a1926;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 8px;outline:none}
    .status{display:none;margin-top:14px;border-radius:9px;padding:11px 12px;font-size:.82rem;line-height:1.5}.status.show{display:block}.status.ok{color:#b9f9ec;background:#10332f;border:1px solid #26665a}.status.err{color:#ffd0d0;background:#351d25;border:1px solid #6c3441}
    .workspace{display:grid;grid-template-rows:minmax(350px,1fr) auto}.map-wrap{position:relative;min-height:410px;background-color:#081824;background-image:linear-gradient(#17304455 1px,transparent 1px),linear-gradient(90deg,#17304455 1px,transparent 1px);background-size:32px 32px}.map-top{position:absolute;z-index:2;left:16px;right:16px;top:15px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.badge{background:#071520dd;border:1px solid #28485e;border-radius:999px;padding:7px 11px;color:#b7cad7;font-size:.73rem;backdrop-filter:blur(5px)}#preview{width:100%;height:100%;min-height:410px;display:block}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6e899b;pointer-events:none}.empty svg{width:62px;opacity:.45;margin-bottom:12px}.empty b{display:block;color:#91a9b9;margin-bottom:5px}.north{position:absolute;right:18px;bottom:18px;color:#6f8da0;font:700 .7rem ui-monospace,monospace;text-align:center}.north:before{content:"";display:block;margin:auto;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:20px solid var(--cyan)}
    .summary{display:grid;grid-template-columns:1.35fr repeat(2,1fr);border-top:1px solid var(--line)}.metric{padding:17px 18px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span{display:block;color:var(--muted);font-size:.71rem;margin-bottom:6px}.metric strong{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem}.metric.primary strong{color:var(--lime);font-size:1.28rem}
    .results{grid-column:1/-1;margin-top:18px}.result-tools{display:flex;align-items:center;gap:9px}.ghost{border:1px solid var(--line);border-radius:8px;background:#102236;color:#dce7ed;padding:8px 11px;font-size:.79rem}.ghost:disabled{opacity:.35;cursor:not-allowed}.table-scroll{overflow:auto;max-height:290px}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:12px 18px;border-bottom:1px solid #182f42;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#0b1d2c;color:#829bad;font-size:.71rem;text-transform:uppercase;letter-spacing:.06em}td.num{font-family:ui-monospace,Consolas,monospace;color:#d8e8ef}tbody tr:hover{background:#11283a}.no-data{text-align:center!important;color:#627f91;padding:34px!important}
    .footnote{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}.note{padding:20px 22px}.note h3{font-size:.9rem;margin:0 0 9px}.note p,.note li{font-size:.79rem;color:var(--muted);line-height:1.75}.note ul{margin:7px 0 0;padding-left:18px}.formula{font-family:ui-monospace,Consolas,monospace;color:var(--cyan)!important;background:#071521;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
    footer{text-align:center;color:#587386;font-size:.72rem;margin-top:24px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.settings{grid-template-columns:1fr 1fr}.footnote{grid-template-columns:1fr}.map-wrap,#preview{min-height:340px}}@media(max-width:560px){.shell{padding:18px 12px 35px}header{align-items:flex-start}.privacy{display:none}.settings{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.metric.primary{grid-column:1/-1;border-bottom:1px solid var(--line)}.panel-head{padding:16px}.input-body{padding:16px}th,td{padding:11px 12px}}
  </style>
  <link rel="stylesheet" href="simple.css">
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><h1>多边形面积计算工具</h1></div>
  </header>

  <section class="grid">
    <article class="panel">
      <div class="panel-head"><h2>导入数据</h2></div>
      <div class="input-body">
        <div class="drop" id="dropZone">
          <div><strong>选择文件</strong><p>Shapefile ZIP / SHP 文件组 / ASCII</p><button class="pick" id="pickBtn">选择文件</button><a class="download" href="示例空间数据_校园地块.zip" download>下载示例数据</a><input id="fileInput" type="file" multiple accept=".zip,.shp,.shx,.dbf,.prj,.cpg,.txt,.csv,.asc"></div>
        </div>
        <div class="or">或粘贴坐标</div>
        <textarea id="asciiInput" spellcheck="false" aria-label="ASCII 坐标输入" placeholder="# 每行 X,Y；空行或 > 开始新多边形&#10;0,0&#10;100,0&#10;100,80&#10;0,80"></textarea>
        <div class="text-actions"><button class="linkbtn" id="sampleBtn">填入坐标示例</button><button class="parsebtn" id="parseBtn">计算坐标</button></div>
        <div class="settings">
          <div class="field"><label for="mode">坐标类型</label><select id="mode"><option value="auto">自动识别</option><option value="geographic">经纬度</option><option value="planar">投影 / 平面</option></select></div>
          <div class="field"><label for="coordUnit">坐标单位</label><select id="coordUnit"><option value="m">米</option><option value="km">千米</option><option value="ft">英尺</option></select></div>
          <div class="field"><label for="outUnit">结果单位</label><select id="outUnit"><option value="m2">平方米</option><option value="km2">平方千米</option><option value="ha">公顷</option><option value="mu">亩</option></select></div>
        </div>
        <div id="status" class="status" role="status"></div>
      </div>
    </article>

    <article class="panel workspace">
      <div class="map-wrap">
        <div class="map-top"><span class="badge" id="sourceBadge">等待数据</span><span class="badge" id="methodBadge">方法：—</span></div>
        <svg id="preview" viewBox="0 0 700 410" preserveAspectRatio="xMidYMid meet" aria-label="多边形预览"></svg>
        <div class="empty" id="empty"><div><b>图形预览</b></div></div>
        <div class="north">N</div>
      </div>
      <div class="summary">
        <div class="metric primary"><span>总面积</span><strong id="totalArea">—</strong></div>
        <div class="metric"><span>多边形数量</span><strong id="featureCount">0</strong></div>
        <div class="metric"><span>顶点总数</span><strong id="vertexCount">0</strong></div>
      </div>
    </article>

    <article class="panel results">
      <div class="panel-head"><div><h2>计算结果</h2></div><div class="result-tools"><button class="ghost" id="copyBtn" disabled>复制总面积</button><button class="ghost" id="csvBtn" disabled>导出 CSV</button></div></div>
      <div class="table-scroll"><table><thead><tr><th>序号</th><th>要素名称</th><th>面积</th><th>占比</th><th>顶点数</th></tr></thead><tbody id="tbody"><tr><td colspan="5" class="no-data">暂无结果，请先导入多边形数据</td></tr></tbody></table></div>
    </article>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const els = {drop:$('#dropZone'),file:$('#fileInput'),ascii:$('#asciiInput'),mode:$('#mode'),coord:$('#coordUnit'),out:$('#outUnit'),status:$('#status'),svg:$('#preview'),empty:$('#empty'),tbody:$('#tbody'),total:$('#totalArea'),count:$('#featureCount'),vertices:$('#vertexCount'),source:$('#sourceBadge'),method:$('#methodBadge'),csv:$('#csvBtn'),copy:$('#copyBtn')};
  let state = {features:[], source:'', prj:'', method:'', results:[]};
  const units = {m2:{label:'m²',factor:1},km2:{label:'km²',factor:1e6},ha:{label:'ha',factor:1e4},mu:{label:'亩',factor:2000/3}};
  const coordScale = {m:1,km:1000,ft:.3048};

  function message(text,type='ok'){els.status.textContent=text;els.status.className='status show '+type}
  function cleanRing(r){const out=r.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(out.length>1&&out[0][0]===out.at(-1)[0]&&out[0][1]===out.at(-1)[1])out.pop();return out}
  function signedPlanar(r){let s=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2}
  function signedSpherical(r){const R=6371008.8,d=Math.PI/180;let s=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];let dl=(b[0]-a[0])*d;if(dl>Math.PI)dl-=2*Math.PI;if(dl<-Math.PI)dl+=2*Math.PI;s+=dl*(2+Math.sin(a[1]*d)+Math.sin(b[1]*d))}return s*R*R/2}
  function featureArea(f,method){const calc=method==='geographic'?signedSpherical:signedPlanar;let v=f.rings.map(calc);let sum=Math.abs(v.reduce((a,b)=>a+b,0));if(!sum&&v.length)sum=v.reduce((a,b)=>a+Math.abs(b),0);if(method==='planar')sum*=coordScale[els.coord.value]**2;return sum}
  function detectMethod(){if(els.mode.value!=='auto')return els.mode.value;const p=state.prj.toUpperCase();if(/PROJCS|PROJCRS|PROJECTION\s*\[/.test(p))return 'planar';if(/GEOGCS|GEODCRS|GEOGRAPHICCRS/.test(p))return 'geographic';const pts=state.features.flatMap(f=>f.rings.flat());return pts.length&&pts.every(([x,y])=>x>=-180&&x<=180&&y>=-90&&y<=90)?'geographic':'planar'}
  function calculate(){if(!state.features.length)return;state.method=detectMethod();state.results=state.features.map((f,i)=>({...f,index:i+1,area:featureArea(f,state.method),vertices:f.rings.reduce((n,r)=>n+r.length,0)}));render()}
  function fmt(n,d=4){if(!Number.isFinite(n))return '—';if(n===0)return '0';if(Math.abs(n)>=1e9||Math.abs(n)<1e-4)return n.toExponential(4);return n.toLocaleString('zh-CN',{maximumFractionDigits:d})}
  function render(){const u=units[els.out.value],total=state.results.reduce((s,r)=>s+r.area,0),converted=total/u.factor;els.total.textContent=fmt(converted,6)+' '+u.label;els.count.textContent=state.results.length;els.vertices.textContent=state.results.reduce((s,r)=>s+r.vertices,0).toLocaleString();els.method.textContent='方法：'+(state.method==='geographic'?'球面面积':'鞋带公式');els.source.textContent=state.source||'已导入';els.csv.disabled=els.copy.disabled=false;els.tbody.innerHTML=state.results.map(r=>`<tr><td>${r.index}</td><td>${escapeHtml(r.name||'多边形 '+r.index)}</td><td class="num">${fmt(r.area/u.factor,6)} ${u.label}</td><td class="num">${total?fmt(r.area/total*100,2):0}%</td><td class="num">${r.vertices}</td></tr>`).join('');draw();}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function draw(){const all=state.features.flatMap(f=>f.rings.flat());if(!all.length)return;const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const dx=maxX-minX||1,dy=maxY-minY||1,pad=38,scale=Math.min((700-pad*2)/dx,(410-pad*2)/dy);const tx=x=>pad+(x-minX)*scale,ty=y=>410-pad-(y-minY)*scale;els.svg.innerHTML=state.features.map((f,fi)=>`<g>${f.rings.map((r,ri)=>`<polygon points="${r.map(p=>tx(p[0]).toFixed(2)+','+ty(p[1]).toFixed(2)).join(' ')}" fill="${ri?'#071320':'hsl('+(165+fi*23%85)+',66%,42%)'}" fill-opacity="${ri?'1':'.25'}" stroke="${ri?'#d7ff57':'#4de1c1'}" stroke-width="${ri?'1.5':'2'}" vector-effect="non-scaling-stroke"/>`).join('')}</g>`).join('');els.empty.style.display='none'}

  function parseAscii(text){const raw=text.replace(/^\uFEFF/,'').split(/\r?\n/),segments=[];let current=[];const three=[];let threeMode=true;
    for(const line0 of raw){const line=line0.trim();if(!line||line.startsWith('>')){if(current.length>=3){segments.push({name:'多边形 '+(segments.length+1),rings:[cleanRing(current)]});current=[]}continue}if(/^#|^\/\//.test(line))continue;const nums=(line.match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g)||[]).map(Number);if(nums.length<2)continue;if(nums.length===3)three.push(nums);else threeMode=false;current.push(nums.slice(-2))}
    if(current.length>=3)segments.push({name:'多边形 '+(segments.length+1),rings:[cleanRing(current)]});
    if(threeMode&&three.length>=3&&new Set(three.map(v=>v[0])).size<three.length){const grouped=new Map();three.forEach(v=>{if(!grouped.has(v[0]))grouped.set(v[0],[]);grouped.get(v[0]).push([v[1],v[2]])});return [...grouped].filter(([,r])=>r.length>=3).map(([id,r])=>({name:'ID '+id,rings:[cleanRing(r)]}))}
    if(!segments.length)throw new Error('没有识别到有效多边形；每个多边形至少需要 3 个坐标点。');return segments}

  function parseShp(buffer,names=[]){const v=new DataView(buffer);if(v.byteLength<100||v.getInt32(0,false)!==9994)throw new Error('SHP 文件头无效。');const headType=v.getInt32(32,true);if(![5,15,25].includes(headType))throw new Error('仅支持多边形 Shapefile（Polygon / PolygonZ / PolygonM）。');let off=100,features=[],idx=0;while(off+8<=v.byteLength){const len=v.getInt32(off+4,false)*2,start=off+8;if(start+len>v.byteLength)break;const type=v.getInt32(start,true);if([5,15,25].includes(type)&&len>=44){const parts=v.getInt32(start+36,true),points=v.getInt32(start+40,true),po=start+44,xy=po+parts*4;if(parts>=1&&points>=3&&xy+points*16<=start+len){const starts=[];for(let i=0;i<parts;i++)starts.push(v.getInt32(po+i*4,true));starts.push(points);const rings=[];for(let p=0;p<parts;p++){const ring=[];for(let i=starts[p];i<starts[p+1];i++)ring.push([v.getFloat64(xy+i*16,true),v.getFloat64(xy+i*16+8,true)]);if(ring.length>=3)rings.push(cleanRing(ring))}if(rings.length)features.push({name:names[idx]||'要素 '+(idx+1),rings});idx++}}off=start+len}if(!features.length)throw new Error('SHP 中没有找到有效的多边形记录。');return features}
  function parseDbf(buffer,encoding='gbk'){const v=new DataView(buffer),bytes=new Uint8Array(buffer);if(v.byteLength<32)return[];let decoder;try{decoder=new TextDecoder(encoding)}catch{decoder=new TextDecoder('gbk')}const count=v.getUint32(4,true),header=v.getUint16(8,true),record=v.getUint16(10,true),fields=[];for(let o=32;o+32<=header-1;o+=32){let name='';for(let i=0;i<11&&bytes[o+i];i++)name+=String.fromCharCode(bytes[o+i]);fields.push({name:name.trim(),type:String.fromCharCode(bytes[o+11]),len:bytes[o+16]})}const preferred=['NAME','MC','XZQMC','TITLE','ID','OBJECTID','FID'];let chosen=fields.find(f=>preferred.includes(f.name.toUpperCase()))||fields.find(f=>f.type==='C')||fields[0],result=[];for(let r=0;r<count;r++){let pos=header+r*record;if(pos+record>bytes.length)break;pos++;for(const f of fields){if(f===chosen){const raw=bytes.slice(pos,pos+f.len);result.push(decoder.decode(raw).replace(/\0/g,'').trim())}pos+=f.len}}return result}
  async function unzip(buffer){const b=new Uint8Array(buffer),v=new DataView(buffer);let eocd=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){eocd=i;break}if(eocd<0)throw new Error('ZIP 目录无效。');const n=v.getUint16(eocd+10,true),cd=v.getUint32(eocd+16,true),files=new Map();let p=cd;for(let k=0;k<n;k++){if(v.getUint32(p,true)!==0x02014b50)break;const method=v.getUint16(p+10,true),compressedSize=v.getUint32(p+20,true),uncompressedSize=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),local=v.getUint32(p+42,true),name=new TextDecoder().decode(b.slice(p+46,p+46+nl));const lnl=v.getUint16(local+26,true),lel=v.getUint16(local+28,true),start=local+30+lnl+lel;let data=b.slice(start,start+compressedSize);if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持解压缩，请直接选择 .shp/.dbf/.prj 文件。');const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())}else if(method!==0)throw new Error('ZIP 使用了不支持的压缩方式。');if(data.byteLength!==uncompressedSize)throw new Error('ZIP 中的文件长度校验失败：'+name);files.set(name.split('/').pop().toLowerCase(),data.buffer);p+=46+nl+el+cl}return files}
  async function handleFiles(fileList){const files=[...fileList];if(!files.length)return;try{let map=new Map();if(files.length===1&&files[0].name.toLowerCase().endsWith('.zip'))map=await unzip(await files[0].arrayBuffer());else for(const f of files)map.set(f.name.toLowerCase(),await f.arrayBuffer());const shpEntry=[...map].find(([n])=>n.endsWith('.shp'));const asciiEntry=[...map].find(([n])=>/\.(txt|csv|asc)$/.test(n));if(shpEntry){const base=shpEntry[0].replace(/\.shp$/,'');const dbf=[...map].find(([n])=>n===base+'.dbf')||[...map].find(([n])=>n.endsWith('.dbf'));const prj=[...map].find(([n])=>n===base+'.prj')||[...map].find(([n])=>n.endsWith('.prj'));const cpg=[...map].find(([n])=>n===base+'.cpg')||[...map].find(([n])=>n.endsWith('.cpg'));const encoding=cpg?new TextDecoder().decode(cpg[1]).trim():'gbk';const names=dbf?parseDbf(dbf[1],encoding):[];state.features=parseShp(shpEntry[1],names);state.prj=prj?new TextDecoder().decode(prj[1]):'';state.source=(files[0].name.toLowerCase().endsWith('.zip')?'ZIP · ':'SHP · ')+state.features.length+' 个要素'}else if(asciiEntry){const text=new TextDecoder().decode(asciiEntry[1]);state.features=parseAscii(text);state.prj='';state.source='ASCII · '+state.features.length+' 个多边形'}else throw new Error('未找到 .shp 或 ASCII 坐标文件。');message('读取成功：'+state.source);calculate()}catch(e){message(e.message||String(e),'err')}}
  function parseText(){try{state.features=parseAscii(els.ascii.value);state.prj='';state.source='粘贴坐标 · '+state.features.length+' 个多边形';message('坐标解析成功。');calculate()}catch(e){message(e.message,'err')}}
  function csv(){const u=units[els.out.value],total=state.results.reduce((s,r)=>s+r.area,0);const rows=[['序号','要素名称','面积','单位','占比','顶点数'],...state.results.map(r=>[r.index,r.name,(r.area/u.factor).toFixed(8),u.label,total?(r.area/total*100).toFixed(4)+'%':'0%',r.vertices])];const text='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='多边形面积计算结果.csv';a.click();URL.revokeObjectURL(a.href)}
  $('#pickBtn').onclick=()=>els.file.click();els.file.onchange=e=>handleFiles(e.target.files);$('#parseBtn').onclick=parseText;$('#sampleBtn').onclick=()=>{els.ascii.value='> L形地块\n0,0\n120,0\n120,40\n50,40\n50,100\n0,100\n0,0';parseText()};els.mode.onchange=calculate;els.coord.onchange=calculate;els.out.onchange=()=>state.results.length&&render();els.csv.onclick=csv;els.copy.onclick=async()=>{const t=els.total.textContent;try{await navigator.clipboard.writeText(t);message('总面积已复制：'+t)}catch{message('复制失败，请手动选择结果。','err')}};
  ['dragenter','dragover'].forEach(n=>els.drop.addEventListener(n,e=>{e.preventDefault();els.drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>els.drop.addEventListener(n,e=>{e.preventDefault();els.drop.classList.remove('drag')}));els.drop.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));
})();
